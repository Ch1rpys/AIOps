<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shield & Ring Primary Gradient (Tech Blue to Cyan) -->
    <linearGradient id="primaryTechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Accent Verification Loop Gradient -->
    <linearGradient id="accentCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base: Rounded Square Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="130" fill="#2563eb" opacity="0.22" filter="url(#neonGlow)" />

  <!-- Outer Defensive Shield / Hexagonal Boundary -->
  <polygon points="256,76 396,156 396,316 256,400 116,316 116,156"
           fill="none" stroke="url(#primaryTechGrad)" stroke-width="14" stroke-linejoin="round" opacity="0.9" />

  <!-- Inner Hex Shield Accent Line -->
  <polygon points="256,108 370,172 370,300 256,366 142,300 142,172"
           fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="10 14" opacity="0.45" />

  <!-- Multi-Agent Autonomous Diagnostic Loop (Orbiting Mobius Ellipse) -->
  <ellipse cx="256" cy="256" rx="146" ry="76" transform="rotate(-30 256 256)"
           fill="none" stroke="url(#accentCyanGrad)" stroke-width="11" stroke-linecap="round" filter="url(#neonGlow)" opacity="0.95" />

  <!-- Automated Verification Reverse Loop -->
  <ellipse cx="256" cy="256" rx="146" ry="76" transform="rotate(30 256 256)"
           fill="none" stroke="#3b82f6" stroke-width="6" stroke-dasharray="16 20" opacity="0.75" />

  <!-- Central Multi-Agent Neural Core -->
  <circle cx="256" cy="256" r="38" fill="#0f172a" stroke="url(#accentCyanGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="20" fill="#38bdf8" filter="url(#neonGlow)" />

  <!-- Distributed Agent Nodes & Fault Diagnosis Interconnects -->
  <!-- Node Top -->
  <line x1="256" y1="218" x2="256" y2="136" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="136" r="14" fill="#0284c7" stroke="#67e8f9" stroke-width="4" />

  <!-- Node Bottom Left -->
  <line x1="222" y1="275" x2="160" y2="310" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <circle cx="160" cy="310" r="14" fill="#0284c7" stroke="#67e8f9" stroke-width="4" />

  <!-- Node Bottom Right -->
  <line x1="290" y1="275" x2="352" y2="310" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <circle cx="352" cy="310" r="14" fill="#0284c7" stroke="#67e8f9" stroke-width="4" />

  <!-- Diagnostic Pulse Sparkles -->
  <circle cx="256" cy="176" r="4" fill="#ffffff" />
  <circle cx="191" cy="292" r="4" fill="#ffffff" />
  <circle cx="321" cy="292" r="4" fill="#ffffff" />
</svg>
