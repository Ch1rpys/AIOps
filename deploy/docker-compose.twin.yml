name: aiops-twin
services:
  demo-mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:?set DEMO_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD:?set DEMO_MYSQL_PASSWORD}
    ports: ["127.0.0.1:${TWIN_MYSQL_PORT:-23306}:3306"]
    volumes: ["twin-mysql-data:/var/lib/mysql"]
    cap_add: ["NET_ADMIN"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u demo -D demo -Nse 'SELECT 1' | grep -qx 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s

  demo-redis:
    build: {context: ../demo/images/redis}
    image: aiops-demo-redis:local
    ports: ["127.0.0.1:${TWIN_REDIS_PORT:-26379}:6379"]
    cap_add: ["NET_ADMIN"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 3s
      timeout: 3s
      retries: 10

  demo-app:
    build: {context: ../demo/demo-app}
    image: aiops-demo-app:local
    environment:
      MYSQL_HOST: demo-mysql
      MYSQL_PORT: "3306"
      DEMO_MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD:?set DEMO_MYSQL_PASSWORD}
      REDIS_HOST: demo-redis
      APP_MODE_FILE: /control/mode
    volumes: ["../demo/twin/app-control:/control:ro"]
    ports: ["127.0.0.1:${TWIN_APP_PORT:-28000}:8000"]
    cap_add: ["NET_ADMIN"]
    depends_on:
      demo-mysql: {condition: service_healthy}
      demo-redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  demo-nginx:
    build: {context: ../demo/images/nginx}
    image: aiops-demo-nginx:local
    ports: ["127.0.0.1:${TWIN_NGINX_PORT:-28080}:80"]
    volumes: ["../demo/twin/nginx/active/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    cap_add: ["NET_ADMIN"]
    depends_on:
      demo-app: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/hello"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  twin-mysql-data:
